# Jarvis configuration

brain:
  host: "http://localhost:11434"
  # Fallback model if router is disabled. With tiered routing, this is rarely used.
  model: "qwen2.5:7b"
  max_tool_iterations: 8

assistant:
  name: "Jarvis"
  persona: "polite"

voice:
  enabled: true
  wake_word: "jarvis"
  stt_model: "base.en"
  tts_engine: "pyttsx3"
  piper_voice: ""

# Tiered model routing:
#   fast   — simple commands, Q&A                  (resident in VRAM)
#   smart  — agentic tasks, browser, research       (loaded on demand)
#   vision — desktop screenshot + click control     (loaded on demand)
# Pull with:
#   ollama pull qwen2.5:7b
#   ollama pull qwen2.5:32b
#   ollama pull qwen2.5vl:7b
models:
  fast: "qwen2.5:7b"
  smart: "qwen2.5:32b"
  vision: "qwen2.5vl:7b"
  keep_alive: "5m"

browser:
  headless: false
  profile_dir: "~/.jarvis/browser_profile"
  max_steps: 30
  commit_keywords:
    - "checkout"
    - "place order"
    - "buy now"
    - "confirm order"
    - "pay now"
    - "submit order"
    - "purchase"
    - "confirm payment"
    - "complete order"
    - "send message"
    - "submit form"

agents:
  browser_enabled: true
  research_enabled: true
  desktop_enabled: true
  # pause_before_commit: stops for your yes/no before any commit action
  # never_commit:        never clicks buy/pay/submit — hands those to you
  # full:                fully autonomous (risky — can spend real money)
  autonomy: "pause_before_commit"
  max_research_sources: 8
  max_research_steps: 12

skills:
  system_control: true
  files: true
  web: true
  productivity: true
  agents: true
  file_roots: []
  data_dir: "~/.jarvis"

safety:
  confirm_actions:
    - shutdown
    - restart
    - delete_file
  blocked_actions: []
