[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pc"
version = "0.1.0"
description = "A voice + text AI assistant for your PC, powered by a local Ollama model."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = ["requests>=2.31", "duckduckgo-search>=6.1", "beautifulsoup4>=4.12"]
clipboard = ["pyperclip>=1.8"]
voice = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "pyttsx3>=2.90",
]
windows = ["pycaw>=20240210", "comtypes>=1.3", "pygetwindow>=0.0.9", "pyautogui>=0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
